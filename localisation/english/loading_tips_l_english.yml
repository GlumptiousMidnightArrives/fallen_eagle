l_english:
 LOADING_TIP_0: "Everything will pass and the damned stain of Bolshevism will be erased like dirt from the face of the Russian land. I have nevertheless laid a good foundation for this, and tens of thousands of traitors will not be resurrected.\n- Alexander Kolchak"
 LOADING_TIP_1: "I am giving you an order, a very cruel one: do not take prisoners! I take responsibility for this order before God and the Russian people!\n- Lvar Kornilov"
 LOADING_TIP_2: "I can do nothing with my army. I am glad when it carries out my combat orders.\n- Anton Denikin"
 LOADING_TIP_3: "It is perfectly natural if communists in emigration take on themselves the initiative for offering theoretical help and political solidarity to the revolutionists struggling inside Hungary.\n- Leon Trotsky, Letter to Hungarian Comrades"
 LOADING_TIP_4: "I'm nearly perishing not only because of the work and the turmoil but also out of concern for the Rote Fahne, in which there is so much still lacking and so many things are still bad.\n- Rosa Luxemburg, Letter to Clara Zetkin"
 LOADING_TIP_5: "Why do you seek a hell in the next world? Is not the hell in which we live and which burns inside us sufficiently dreadful?\n- Jörg Lanz von Liebenfels, Theozoology"
 LOADING_TIP_6: "We have come here, to the Sea, after a hard and bloody effort. We see that our effort has not been wasted. We swear that we will never leave you. By throwing this ring into your waves, I am marrying you, because you have always been and always be ours.\n- Franciszek Niewidziajlo"
 LOADING_TIP_7: "At any given moment, communists are willing to sacrifice communists if, at that price, they can save a great fraud and lie: Communism.\n- Sándor Márai"
 LOADING_TIP_8: "Peace, land and bread!.\n- Bolshevik slogan"
 LOADING_TIP_9: "You are, gentlemen, representatives of a peoples which is proud and can be proud of its past, and which needs to have faith in its future. Do not diminish the role it must have in the world; Be as modest for yourselves, don't be modest for the nation you represent!\n- Ion I. C. Brătianu"
 LOADING_TIP_10: "He's a Polish adherent who cannot be trusted.\n- Liudas Gira, talking about Žukauskas"