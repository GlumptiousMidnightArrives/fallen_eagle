l_english:
 first_united_front: "First United Front"
 first_united_front_desc: "Despite the betrayal of Chiang Kai-Shek and his rightist traitors, the alliance between the Wang Jingwei's KMT and the CPC remains intact. Now faced with a common enemy in Chiang's Nanjing government, the United Front has grown even closer to counter this new threat."
 GER_the_second_armament_program: "Second Rearmament Program"
 GER_the_second_armament_program_desc: "The Second Rearmament Program is the secret government plan produced by Wilhelm Groener. At a cost of 484 million Reichsmarks, the plan is to establish a 21-division army along with the necessary equipment, weapons and ammunition, plus a six-week stockpile. Unlike previous plans however; this one includes the airforce. Several military divisions have been sent to Russia to get assistance in training and to study more modern equipment and artillery."
 PRC_fifth_encirclement_campaign: "Fifth Counter-Encirclement Campaign"
 PRC_fifth_encirclement_campaign_desc: "The Fifth Counter-Encirclement Campaign against our revolutionary base has proven the most formidable yet. Our Soviet has been repeatedly assailed by the rightist enemy, but we refuse to surrender. When the time is right, we shall counter-encircle our foe and destroy their ability to wage war!"
 CHI_fifth_encirclement_campaign: "Fifth Encirclement Campaign"
 CHI_fifth_encirclement_campaign_desc: "The Fifth Encirclement Campaign has entered its second year. Though our high command and Generallissimo remain committed to the effort, our troops and civilians are beginning to suffer under the effects of the prolonged campaign. We must bring the enemy Soviet to an end, and fast!"