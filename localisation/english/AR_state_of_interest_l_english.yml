 BEA_tanganyika: "Tanganyika Territory"
 BEA_tanganyika_desc: "§YCapital:§! Dar es Salaam\n\nThe Tanganyika Territory is a §YClass B League of Nations mandate§! under British administration, it was established in 1916 after the entente occupation of German East Africa."

 IET_sinkiang: "Sinkiang Province"
 IET_sinkiang_desc: "§YAdministrative Capital:§! Tihwa (Ürümqi)\n\nThe Sinkiang province is a §YChinese Administrative Province§!, it was usurped by Republican Governor Yang Zengxin in 1912 after the fall of the Qing Dynasty. During the warlord period it has been divided between smaller warlords."

