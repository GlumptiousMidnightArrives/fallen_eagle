 BEA_uganda: "Protectorate of Uganda"
 BEA_uganda_desc: "§YCapital:§! Entebbe\n\nThe Protectorate of Uganda is a §Yprotectorate§! under Britain, it was established a year after the Imperial British East Africa Company transferred its administration rights of territory consisting mainly of the Kingdom of Buganda to the British government."

 BEA_zanzibar: "Sultanate of Zanzibar"
 BEA_zanzibar_desc: "§YCapital:§! Zanzibar\n\nThe Sultanate of Zanzibar is a §Yprotectorate§! under Britain, the protectorate was decided during the signing of the Heligoland-Zanzibar Treaty between the United Kingdom and the German Empire in 1890. Following the death of Sultan Hamad bin Thuwaini, Britain and Zanzibar fought a 38-minute war, the shortest in recorded history which eventually ended in British control being established on the islands."

 JAP_korea: "Colony of Chosen"
 JAP_korea_desc: "§YAdministrative Capital:§! Keijō\n\nThe §YJapanese Colony§! of Chōsen was established following the annexation of the Korean Empire in 1910. The colony is undergoing the process of Japanization, with Japanese colonists immigrating into the colony and displacing native Koreans through land purchases."

 ENG_kulangsu: "Kulangsu Int. Settlement"
 ENG_kulangsu_desc: "Established in 1902 in response to Japanese encroachment on nearby Xiamen, Kulangsu is an §Yinternational settlement§!, open to Chinese and Westerners alike. It is currently under the protection of the British Empire due to its close proximity to the British concession in Xiamen."